<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE7BE"/>
      <stop offset="0.52" stop-color="#E9C48F"/>
      <stop offset="1" stop-color="#C68220"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.31"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- full-bleed gold squircle: bright on dark browser UI, dark C reads on light UI -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#shade)"/>
  <rect x="0.7" y="0.7" width="62.6" height="62.6" rx="13.5" fill="none" stroke="#2A1A10" stroke-opacity="0.3" stroke-width="1.4"/>
  <!-- steam -->
  <path d="M32 6.2 C30.2 9.2 33.8 11.8 32 16"
        fill="none" stroke="#2A1A10" stroke-width="2.9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bold C with flat terminals, open on the right -->
  <path d="M43.9 25.6 A17 17 0 1 0 43.9 44.4"
        fill="none" stroke="#2A1A10" stroke-width="8.2"
        stroke-linecap="butt" stroke-linejoin="round"/>
  <!-- gloss -->
  <path d="M24.9 26.5 A13 13 0 0 0 20.4 33.5"
        fill="none" stroke="#FFF6E3" stroke-opacity="0.6" stroke-width="2.2"
        stroke-linecap="round"/>
</svg>
